
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reel Riddle</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      text-align: center;
    }

    .container {
      max-width: 500px;
      margin: 30px auto;
      padding: 25px 18px;
      background: #1f2937;
      border-radius: 15px;
    }

    h1 {
      color: #f9a8d4;
    }

    button {
      padding: 13px 20px;
      margin: 8px;
      border: none;
      border-radius: 9px;
      background: #ec4899;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .clue-button {
      display: block;
      width: 100%;
      margin: 12px 0;
      background: #374151;
    }

    .clue-button:hover {
      background: #4b5563;
    }

    #status {
      margin-top: 20px;
      color: #f9a8d4;
      min-height: 24px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>🎬 Reel Riddle</h1>
    <p>Listen to the audio clues and guess the movie!</p>

    <h3>Select Language</h3>
    <button onclick="selectLanguage('Telugu')">Telugu</button>
    <button onclick="selectLanguage('Hindi')">Hindi</button>

    <div id="clues"></div>
    <p id="status">Select Telugu or Hindi to begin.</p>
  </div>

  <script type="module">
    import { createClient } from
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL =
      "https://fnrpbipybkraazuvthpd.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_Uarpo7EMMahoVKUOXQ1a2g_fVa5czZc";

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    let currentAudio = null;
    let currentIndex = null;

    const cluesDiv = document.getElementById("clues");
    const statusDiv = document.getElementById("status");

    function getTodayDate() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, "0");
      const day = String(now.getDate()).padStart(2, "0");

      return `${year}-${month}-${day}`;
    }

    window.selectLanguage = async function(language) {
      stopAudio();

      cluesDiv.innerHTML = "";
      statusDiv.textContent = "Loading today's challenge...";

      const today = getTodayDate();

      const { data, error } = await supabase
        .from("daily_challenges")
        .select("*")
        .eq("challenge_date", today)
        .eq("language", language)
        .maybeSingle();

      if (error) {
        statusDiv.textContent = "Could not load challenge. Please try again.";
        console.error(error);
        return;
      }

      if (!data || !data.audio_paths || data.audio_paths.length === 0) {
        statusDiv.textContent = "No challenge available for today.";
        return;
      }

      cluesDiv.innerHTML = "<h3>Listen to the Clues</h3>";

      data.audio_paths.forEach((audioUrl, index) => {
        const button = document.createElement("button");

        button.className = "clue-button";
        button.textContent = `▶ Play Clue ${index + 1}`;

        button.onclick = () => toggleClue(index, audioUrl);

        cluesDiv.appendChild(button);
      });

      statusDiv.textContent = `${language} challenge loaded successfully!`;
    };

    function stopAudio() {
      if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
      }

      currentAudio = null;
      currentIndex = null;

      document.querySelectorAll(".clue-button").forEach((button, index) => {
        button.textContent = `▶ Play Clue ${index + 1}`;
      });
    }

    async function toggleClue(index, audioUrl) {
      const buttons = document.querySelectorAll(".clue-button");
      const button = buttons[index];

      // Pause or resume the currently selected clue.
      if (currentAudio && currentIndex === index) {
        if (currentAudio.paused) {
          try {
            await currentAudio.play();
            button.textContent = `⏸ Pause Clue ${index + 1}`;
            statusDiv.textContent = `Playing Clue ${index + 1}`;
          } catch (error) {
            button.textContent = `▶ Play Clue ${index + 1}`;
            statusDiv.textContent = "Audio could not play. Please try again.";
          }
        } else {
          currentAudio.pause();
          button.textContent = `▶ Play Clue ${index + 1}`;
          statusDiv.textContent = `Clue ${index + 1} paused.`;
        }

        return;
      }

      // Stop the previous clue before starting another one.
      stopAudio();

      currentAudio = new Audio(audioUrl);
      currentIndex = index;

      currentAudio.addEventListener("ended", () => {
        if (currentIndex === index) {
          button.textContent = `▶ Play Clue ${index + 1}`;
          statusDiv.textContent = `Clue ${index + 1} completed.`;
          currentAudio = null;
          currentIndex = null;
        }
      });

      currentAudio.addEventListener("error", () => {
        if (currentIndex === index) {
          button.textContent = `▶ Play Clue ${index + 1}`;
          statusDiv.textContent = "Audio could not play. Please check the uploaded audio file.";
          currentAudio = null;
          currentIndex = null;
        }
      });

      try {
        await currentAudio.play();
        button.textContent = `⏸ Pause Clue ${index + 1}`;
        statusDiv.textContent = `Playing Clue ${index + 1}`;
      } catch (error) {
        button.textContent = `▶ Play Clue ${index + 1}`;
        statusDiv.textContent = "Audio could not play. Please try again.";
        currentAudio = null;
        currentIndex = null;
      }
    }
  </script>
</body>
</html>
