
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reel Riddle</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body {
  font-family: Arial, sans-serif;
  background: #101020;
  color: white;
  text-align: center;
  padding: 25px 15px;
}
.container {
  max-width: 450px;
  margin: auto;
  background: #202038;
  padding: 25px;
  border-radius: 16px;
}
h1 { color: #ffcc66; }
button {
  padding: 13px 20px;
  margin: 8px;
  border: none;
  border-radius: 25px;
  background: #ffcc66;
  color: #171727;
  font-weight: bold;
  cursor: pointer;
}
.clue {
  background: #30304b;
  padding: 10px;
  margin: 12px 0;
  border-radius: 10px;
}
#status { margin: 18px 0; color: #ffcc66; }
</style>
</head>
<body>
<div class="container">
  <h1>🎬 Reel Riddle</h1>
  <p>Listen carefully and guess the movie!</p>

  <button onclick="selectLanguage('Telugu')">Telugu</button>
  <button onclick="selectLanguage('Hindi')">Hindi</button>

  <h3 id="languageTitle">Choose your language</h3>
  <div id="status">Please select a language.</div>
  <div id="clues"></div>
  <p id="answerMessage"></p>
</div>

<script>
const SUPABASE_URL = "https://fnrpbipybkraazuvthpd.supabase.co";
const SUPABASE_KEY = "sb_publishable_Uarpo7EMMahoVKUOXQ1a2g_fVa5czZc";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentChallenge = null;
let currentAudio = null;

function getLocalDate() {
  const now = new Date();
  const year = now.getFullYear();
  const month = String(now.getMonth() + 1).padStart(2, "0");
  const day = String(now.getDate()).padStart(2, "0");
  return `${year}-${month}-${day}`;
}

async function selectLanguage(language) {
  document.getElementById("languageTitle").textContent = language + " Challenge";
  document.getElementById("status").textContent = "Loading challenge...";
  document.getElementById("clues").innerHTML = "";
  document.getElementById("answerMessage").textContent = "";

  if (currentAudio) {
    currentAudio.pause();
    currentAudio = null;
  }

  const today = getLocalDate();

  const { data, error } = await db
    .from("daily_challenges")
    .select("id, challenge_date, language, audio_paths")
    .eq("challenge_date", today)
    .eq("language", language)
    .maybeSingle();

  if (error) {
    document.getElementById("status").textContent =
      "Error loading challenge: " + error.message;
    return;
  }

  if (!data) {
    document.getElementById("status").textContent =
      "No " + language + " challenge published for today.";
    return;
  }

  if (!Array.isArray(data.audio_paths) || data.audio_paths.length < 4) {
    document.getElementById("status").textContent =
      "The challenge does not have all four audio clues.";
    return;
  }

  currentChallenge = data;
  document.getElementById("status").textContent =
    "Today's challenge is ready!";

  const clues = document.getElementById("clues");

  for (let i = 0; i < 4; i++) {
    const item = document.createElement("div");
    item.className = "clue";

    const button = document.createElement("button");
    button.textContent = "▶ Play Clue " + (i + 1);
    button.onclick = () => playClue(i);

    item.appendChild(button);
    clues.appendChild(item);
  }

  document.getElementById("answerMessage").textContent =
    "Answer checking is being connected securely.";
}

function playClue(index) {
  if (!currentChallenge || !currentChallenge.audio_paths[index]) {
    document.getElementById("status").textContent =
      "This audio clue is not available.";
    return;
  }

  if (currentAudio) {
    currentAudio.pause();
    currentAudio.currentTime = 0;
  }

  currentAudio = new Audio(currentChallenge.audio_paths[index]);

  currentAudio.play().then(() => {
    document.getElementById("status").textContent =
      "Playing Clue " + (index + 1);
  }).catch(error => {
    document.getElementById("status").textContent =
      "Audio could not play. Please check the uploaded audio file.";
    console.error(error);
  });
}
</script>
</body>
</html>
